services:
  postgres:
    image: postgres:16-alpine
    container_name: dispo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dispo
      POSTGRES_PASSWORD: dispo
      POSTGRES_DB: dispo
    # 5433 côté hôte : le 5432 est déjà occupé par un Postgres local.
    ports:
      - "5433:5432"
    volumes:
      - dispo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispo -d dispo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dispo-pgdata:
